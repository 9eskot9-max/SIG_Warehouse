<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Visit Portal</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f2f6f8;color:#142b3b;margin:0;padding:24px}main{max-width:480px;margin:8vh auto;background:white;padding:24px;border-radius:16px;box-shadow:0 6px 24px #1232}h1{font-size:24px}p{line-height:1.5}button,a{box-sizing:border-box;display:block;width:100%;padding:16px;margin-top:12px;border:0;border-radius:10px;font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}button,.start{background:#087451;color:white}.end{background:#e9f1f4;color:#142b3b}button:disabled{opacity:.6}.note{color:#526977;font-size:14px}
  </style>
</head>
<body><main>
  <h1>Field Visit | زيارة الموقع</h1>
  <p>Start finds the nearest ERP site and opens WhatsApp with its start message.</p>
  <button id="locate">Start visit | بدء الزيارة</button>
  <p id="status" class="note" aria-live="polite"></p>
  <details id="debug-panel" hidden><summary>Debug details</summary><pre id="debug-output" style="white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace"></pre><button id="copy-debug" type="button" class="end">Copy debug details</button></details>
  <a class="end" href="https://wa.me/?text=end" target="_blank" rel="noopener noreferrer">End visit | إنهاء الزيارة</a>
  <p class="note">Choose the same field group for both messages, then send the message in WhatsApp.</p>
</main>
<script>
  const csrfToken = "{{ frappe.session.csrf_token }}";
  const locate = document.querySelector('#locate'), status = document.querySelector('#status');
  const debugPanel = document.querySelector('#debug-panel'), debugOutput = document.querySelector('#debug-output');
  let debugLines = [];
  function logDebug(key, value) { debugLines.push(`${new Date().toISOString()} ${key}: ${String(value).slice(0, 300)}`); debugOutput.textContent = debugLines.join('\n'); debugPanel.hidden = false; }
  function getErpError(payload) {
    if (!payload || typeof payload !== 'object') return 'Request rejected';
    let message = '';
    if (typeof payload.exception === 'string') message = payload.exception.split('\n')[0];
    if (!message && typeof payload.message === 'string') message = payload.message;
    let serverMessages = payload._server_messages;
    if (typeof serverMessages === 'string') { try { serverMessages = JSON.parse(serverMessages); } catch (_) { serverMessages = []; } }
    if (!message && Array.isArray(serverMessages)) {
      for (const raw of serverMessages) {
        try { const item = typeof raw === 'string' ? JSON.parse(raw) : raw; if (item && item.message) { message = item.message; break; } }
        catch (_) {}
      }
    }
    message = String(message || 'Request rejected').replace(/\s+/g, ' ').slice(0, 240);
    const type = String(payload.exc_type || '').replace(/[^A-Za-z0-9_.]/g, '').slice(0, 80);
    if (message.includes('Traceback') || message.includes('File "')) message = 'Server-side error';
    return type ? `${type}: ${message}` : message;
  }
  document.querySelector('#copy-debug').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(debugLines.join('\n')); status.textContent = 'Debug details copied.'; }
    catch (_) { status.textContent = 'Could not access clipboard; select and copy the debug details above.'; }
  });
  function requestPosition(onSuccess, onFailure) {
    navigator.geolocation.getCurrentPosition(onSuccess, (error) => {
      if (error.code === error.TIMEOUT || error.code === error.POSITION_UNAVAILABLE) {
        status.textContent = 'Precise location is taking too long. Trying network location…';
        logDebug('gps_fallback', `retrying approximate location after code ${error.code}`);
        navigator.geolocation.getCurrentPosition(onSuccess, onFailure, { enableHighAccuracy: false, timeout: 45000, maximumAge: 0 });
        return;
      }
      onFailure(error);
    }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  }
  locate.addEventListener('click', () => {
    debugLines = []; debugPanel.hidden = true; debugOutput.textContent = '';
    logDebug('page', location.pathname); logDebug('secure_context', window.isSecureContext);
    if (!navigator.geolocation) { status.textContent = 'Location is not available in this browser.'; logDebug('gps', 'Geolocation API unavailable'); return; }
    locate.disabled = true; status.textContent = 'Finding your location…';
    requestPosition(async (position) => {
      try {
        logDebug('gps', `success; accuracy ±${Math.round(position.coords.accuracy)} m`);
        status.textContent = 'Checking ERP sites…';
        logDebug('erp_lookup', 'request started');
        const response = await fetch('/api/method/sig_warehouse.sig_warehouse.public_site_lookup.nearby_sites', { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': csrfToken }, body: JSON.stringify({ latitude: position.coords.latitude, longitude: position.coords.longitude }) });
        logDebug('erp_http_status', response.status);
        const payload = await response.json();
        const result = payload.message || payload;
        if (!response.ok) { const detail = typeof result === 'string' ? result : getErpError(payload); logDebug('erp_error', detail); throw new Error(`ERP lookup failed (HTTP ${response.status}). Open Debug details for the error.`); }
        if (!result || !Array.isArray(result.sites)) { logDebug('erp_response', 'Expected a sites list; received an unexpected response.'); throw new Error('ERP returned an unexpected site lookup response.'); }
        logDebug('matching_sites', result.sites.length);
        if (!result.sites.length) { status.textContent = `No ERP site found within ${result.radius} m. Check the site coordinates in ERP or try again.`; return; }
        const nearest = result.sites[0];
        const accuracy = Math.round(position.coords.accuracy);
        logDebug('nearest_site', `${nearest.id} at ${nearest.meters} m`);
        status.textContent = `Found ${nearest.id} (${nearest.meters} m). GPS accuracy: ±${accuracy} m. Opening WhatsApp…`;
        window.location.assign('https://wa.me/?text=' + encodeURIComponent(nearest.id + ' start'));
      } catch (error) { logDebug('lookup_failure', `${error.name || 'Error'}: ${error.message || 'unknown error'}`); status.textContent = error.message || 'Could not find sites.'; }
      finally { locate.disabled = false; }
    }, (error) => { logDebug('gps_failure', `code ${error.code || 'unknown'}: ${error.message || 'unknown error'}`); status.textContent = `Location unavailable: ${error.message}. Try again or check location access.`; locate.disabled = false; });
  });
</script></body></html>
